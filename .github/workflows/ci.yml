name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roleradar
          POSTGRES_PASSWORD: roleradar
          POSTGRES_DB: roleradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roleradar -d roleradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://roleradar:roleradar@127.0.0.1:5432/roleradar_test?schema=public
      JWT_SECRET: ci-secret-that-is-at-least-32-characters
      CRON_SECRET: ci-cron-secret-that-is-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace @roleradar/api run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Apply migrations to clean Postgres
        run: npm --workspace @roleradar/api run db:deploy

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
