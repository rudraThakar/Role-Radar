name: Scheduled discovery

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger matching-job discovery
        env:
          API_BASE_URL: ${{ secrets.ROLERADAR_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.ROLERADAR_CRON_SECRET }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 900 \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/schedules/discovery"
