services:
  postgres:
    image: postgres:16-alpine
    container_name: roleradar-postgres
    environment:
      POSTGRES_USER: roleradar
      POSTGRES_PASSWORD: roleradar
      POSTGRES_DB: roleradar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roleradar -d roleradar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

